[package]
name = "now-we-can"
version = "0.3.1"
edition = "2024"
description = "Repository-local prospective memory for coding agents"
repository = "https://github.com/lucasrgt/now-we-can"
license = "MIT"
readme = "README.md"

[workspace]
members = ["xtask"]
resolver = "3"

[lib]
name = "nwc"

[[bin]]
name = "nwc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ulid = "3"

[dev-dependencies]
tempfile = "3"
